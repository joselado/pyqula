[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyqula"
dynamic = ["version"]
description = "Python library to compute quantum tight-binding models on lattices"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "Jose Lado", email = "joselado@aalto.fi"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "matplotlib>=3.10.0",
    "numba>=0.60.0",
    "multiprocess>=0.70.19",
    "dill>=0.4.1",
    "threadpoolctl>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/joselado/pyqula"
Repository = "https://github.com/joselado/pyqula"
"Bug Tracker" = "https://github.com/joselado/pyqula/issues"

# Optional, heavier backends that are only imported lazily by specific
# submodules (classicalspin.py, kwantlink.py, ...) - not needed for the
# core library.
[project.optional-dependencies]
jax = ["jax>=0.8.1"]
kwant = ["kwant>=1.5.0"]
mpi = ["mpi4py>=4.1.2"]
dataframe = ["pandas>=2.2.3"]
images = ["pillow>=11.1.0"]
all = ["pyqula[jax,kwant,mpi,dataframe,images]"]
dev = ["pytest>=8.3.4", "build>=1.3.0", "twine>=6.2.0"]

[tool.setuptools.dynamic]
version = {attr = "pyqula.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyqula = [
    "datasets/*.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: exercises a larger/slower configuration than the default suite targets",
]
